[package]
name = "rustyedit-io"
version.workspace = true
edition.workspace = true

[dependencies]
rustyedit-core = { path = "../core" }
rustyedit-processing = { path = "../processing" }
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
    "tiff",
    "bmp",
] }
walkdir = "2"
rayon = "1"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# Reading XMP sidecars (already built for the UI's SVG icons).
roxmltree = "0.20.0"
rawler = "0.8.0"
kamadak-exif = "0.6.1"
trash = "5.2.9"
