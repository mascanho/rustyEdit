[package]
name = "rustyedit-io"
version.workspace = true
edition.workspace = true

[dependencies]
rustyedit-core = { path = "../core" }
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
    "tiff",
    "bmp",
] }
walkdir = "2"
rayon = "1"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
