[package]
name = "rustyedit"
version.workspace = true
edition.workspace = true

[[bin]]
name = "rustyedit"
path = "src/main.rs"

[dependencies]
rustyedit-core = { path = "../core" }
rustyedit-io = { path = "../io" }
rustyedit-processing = { path = "../processing" }
rustyedit-ui = { path = "../ui" }
gpui = { version = "0.2.2", features = ["macos-blade"] }
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "bmp"] }
anyhow = "1.0.104"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSScreen", "NSColorSpace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
