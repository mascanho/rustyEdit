[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/io",
    "crates/processing",
    "crates/ui",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.dev]
opt-level = 1
# Incremental builds keep linking against stale optimised pieces of the
# dependencies ("Undefined symbols … .llvm.NNN"), so build each crate whole.
incremental = false

[profile.dev.package."*"]
opt-level = 3
